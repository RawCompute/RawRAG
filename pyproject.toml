[project]
name = "rawrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prabal Singh", email = "prabalpsingh2429@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "google-generativeai>=0.8.6",
    "numpy>=2.5.4",
    "pypdf2>=3.0.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
rawrag = "rawrag:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
